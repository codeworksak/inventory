spring:
  application:
    name: inventory
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  sql:
    init:
      mode: always
  datasource:
    url: jdbc:postgresql://localhost:5432/inventorydb
    username: postgres
    password: pass123
    driver-class-name: org.postgresql.Driver
    jpa:
      hibernate:
        ddl-auto: none
      show-sql: true
      properties:
        hibernate:
          format_sql: true
      defer-datasource-initilization: true
